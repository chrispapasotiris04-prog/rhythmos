function audInject(){var ov=document.getElementById('focusOverlay');if(ov){var b=ov.querySelector('.aud-float');if(!b){b=document.createElement('button');b.className='aud-ico aud-float';b.setAttribute('aria-label','Ήχοι');b.onclick=function(){openAudioSheet();};b.innerHTML=HEAD_SVG;ov.appendChild(b);}b.classList.toggle('playing',!!state.audio.playing);var s=ov.querySelector('.aud-stop');if(!s){s=document.createElement('button');s.className='aud-ico aud-stop';s.setAttribute('aria-label','Διακοπή ήχου');s.onclick=function(){audStopAll();};s.innerHTML=STOP_SVG;ov.appendChild(s);}s.style.display=state.audio.playing?'grid':'none';}
var fab=document.querySelector('.aud-fab');if(!fab){fab=document.createElement('button');fab.className='aud-fab';fab.setAttribute('aria-label','Ήχοι');fab.onclick=function(){openAudioSheet();};fab.innerHTML=HEAD_SVG;document.body.appendChild(fab);}fab.classList.toggle('playing',!!state.audio.playing);}
var _ufo=updateFocusOverlay;updateFocusOverlay=function(f){_ufo(f);audInject();};
var _ul=updateLive;updateLive=function(){_ul();audInject();};
function audTest(){var sr=22050,n=sr;var s=new Float32Array(n);for(var i=0;i<n;i++){var t=i/sr;var env=t<0.05?t/0.05:(t>0.95?(1-t)/0.05:1);s[i]=0.4*Math.sin(2*Math.PI*440*t)*env;}var u=URL.createObjectURL(encodeWav(s,sr));var t2=new Audio(u);t2.volume=(state.audio.volume>0?state.audio.volume:0.7);t2.play().then(function(){showToast('Δοκιμή: το μονοπάτι ήχου δουλεύει.');}).catch(function(e){showToast('Δοκιμή απέτυχε ('+(e&&e.name?e.name:'σφάλμα')+'). Το πρόβλημα είναι στη συσκευή ή στον browser.');});}
function openCategorySheet(catId){var c=state.audio.categories.find(function(x){return x.id===catId;});if(!c)return;if(modalOpen){closeModal();}
var body='<div class="actions" style="margin:0 0 12px"><button class="btn btn-primary" onclick="audPick(\''+catId+'\')">Προσθήκη από συσκευή</button><button class="btn btn-ghost" onclick="audRenameCat(\''+catId+'\')">Μετονομασία</button><button class="btn btn-ghost-danger" onclick="audDelCat(\''+catId+'\')">Διαγραφή</button></div>';
body+=c.tracks.length?c.tracks.map(function(t){var cur=state.audio.curTrack===t.id&&state.audio.playing;return '<div class="aud-row"><button class="aud-ico '+(cur?'playing':'')+'" onclick="audPlayTrack(\''+catId+'\',state.audio.categories.find(function(x){return x.id===\''+catId+'\';}).tracks.find(function(x){return x.id===\''+t.id+'\';}));audReopen(function(){openCategorySheet(\''+catId+'\');})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg></button><span class="aname">'+esc(t.name)+'</span><button class="aud-ico" onclick="audDelTrack(\''+catId+'\',\''+t.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button></div>';}).join(''):'<p class="muted">Κανένας ήχος ακόμη. Πρόσθεσε αρχεία από τη συσκευή.</p>';
openModal({title:c.name,body:body,buttons:[{text:'Πίσω',class:'btn-ghost',close:false,onClick:function(){audReopen(openAudioSheet);}},{text:'Κλείσιμο'}]});}
function openAudioSheet(){ensureBuiltin();audNormalize();if(modalOpen){closeModal();}var a=state.audio;var cur=audFindTrack();
var body='<div class="aud-bar"><button class="aud-ico '+(a.playing?'playing':'')+'" onclick="audToggle();audReopen(openAudioSheet);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(a.playing?'<path d="M8 5v14"/><path d="M16 5v14"/>':'<path d="M7 4l12 8-12 8z"/>')+'</svg></button><button class="aud-ico" onclick="audNext();audReopen(openAudioSheet);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/></svg></button><input type="range" min="0" max="1" step="0.05" value="'+a.volume+'" onchange="audSetVol(parseFloat(this.value))"><button class="aud-ico" onclick="audStopAll();audReopen(openAudioSheet);">'+STOP_SVG+'</button><button class="aud-ico" onclick="audTest();" aria-label="Δοκιμή ήχου"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button><button class="aud-ico '+(a.loop?'playing':'')+'" onclick="state.audio.loop=!state.audio.loop;AUD_EL.loop=state.audio.loop;saveState();audReopen(openAudioSheet);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button></div>';
body+='<p class="muted" style="margin:0 0 12px">'+(cur?('Παίζει: '+esc(cur.name)):'Τίποτα δεν παίζει.')+'</p>';
body+=a.categories.map(function(c){return '<button class="aud-cat" onclick="audReopen(function(){openCategorySheet(\''+c.id+'\');})"><strong>'+esc(c.name)+'</strong><span>'+c.tracks.length+' ήχοι</span></button>';}).join('');
body+='<div class="actions" style="margin-top:10px"><button class="btn btn-ghost" onclick="audNewCat()">Νέα κατηγορία</button></div>';
openModal({title:'Ήχοι & κατηγορίες',body:body,buttons:[{text:'Κλείσιμο'}]});}
function safeCtl(){return (navigator.serviceWorker&&navigator.serviceWorker.controller)?navigator.serviceWorker.controller:null;}
function safeSetForce(on,then){var sw=safeCtl();if(sw){try{sw.postMessage({type:'set-force',on:!!on});}catch(e){}}setTimeout(function(){if(then)then();},150);}
function safeToast(m){var t=document.getElementById('safeToast');if(!t){t=document.createElement('div');t.id='safeToast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#202748;color:#fff;padding:10px 16px;border-radius:999px;font:700 .84rem system-ui,sans-serif;z-index:400;transition:opacity .3s';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},2200);}
function safeExport(){try{var raw=localStorage.getItem('rhythmos_time_app_v4');if(!raw){safeToast('Δεν βρέθηκαν δεδομένα.');return;}var b=new Blob([raw],{type:'application/json'});var u=URL.createObjectURL(b);var a=document.createElement('a');var d=new Date();a.href=u;a.download='rhythmos-backup-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1500);safeToast('Το αντίγραφο κατέβηκε.');}catch(e){safeToast('Αποτυχία εξαγωγής.');}}
function safeRollback(){var sw=safeCtl();if(!sw){safeToast('Χωρίς ενεργό service worker η επαναφορά δεν γίνεται: το sw.js είναι σπασμένο ή μη εγγεγραμμένο.');return;}safeSetForce(true,function(){location.reload();});}
function safeRetryLatest(){safeSetForce(false,function(){location.reload();});}
function safeSettings(){var old=document.getElementById('safePanel');if(old)old.remove();var v='άγνωστη';try{var m=document.documentElement.outerHTML.match(/name="app-version"\s+content="([^"]+)"/);if(m)v=m[1];}catch(e){}
var p=document.createElement('div');p.id='safePanel';p.style.cssText='position:fixed;inset:0;z-index:390;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center';
p.innerHTML='<div style="width:100%;max-width:430px;background:#1e1e2e;color:#fff;border-radius:28px 28px 0 0;padding:18px 18px 26px;font-family:system-ui,sans-serif"><h3 style="margin:0 0 6px;font-size:1.1rem">Ασφαλής λειτουργία</h3><p style="margin:0 0 14px;font-size:.82rem;opacity:.75">Έκδοση αρχείου: '+v+'. Αυτός ο πίνακας λειτουργεί ακόμα κι αν η εφαρμογή έχει σπάσει.</p><button style="display:block;width:100%;margin-bottom:8px;padding:12px;border:none;border-radius:14px;background:#6366f1;color:#fff;font:700 .9rem system-ui,sans-serif" onclick="safeRollback()">Επαναφορά από το backup (good/)</button><button style="display:block;width:100%;margin-bottom:8px;padding:12px;border:none;border-radius:14px;background:#333a55;color:#fff;font:700 .9rem system-ui,sans-serif" onclick="safeRetryLatest()">Δοκίμασε ξανά την τελευταία έκδοση</button><button style="display:block;width:100%;margin-bottom:8px;padding:12px;border:none;border-radius:14px;background:#333a55;color:#fff;font:700 .9rem system-ui,sans-serif" onclick="safeExport()">Εξαγωγή δεδομένων (backup)</button><button style="display:block;width:100%;padding:12px;border:none;border-radius:14px;background:#553333;color:#fff;font:700 .9rem system-ui,sans-serif" onclick="document.getElementById(\'safePanel\').remove()">Κλείσιμο</button></div>';
p.onclick=function(e){if(e.target===p)p.remove();};document.body.appendChild(p);}
window.safeSettings=safeSettings;
(function(){var sw=safeCtl();if(sw){try{sw.postMessage({type:'get-force'});}catch(e){}}if(navigator.serviceWorker&&navigator.serviceWorker.addEventListener){navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.type==='force-state'){window.__force=e.data.on;}});}})();
ensureBuiltin();audNormalize();saveState();
</script>

<script>
if(typeof state.audio.shuffle==='undefined'){state.audio.shuffle=false;saveState();}
var SHUFFLE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>';
function audCatName(catId){var c=state.audio.categories.find(function(x){return x.id===catId;});return c?c.name:'Ρυθμός';}
function audSetMedia(tr,catId){if(!('mediaSession' in navigator))return;try{navigator.mediaSession.metadata=new MediaMetadata({title:tr.name,artist:audCatName(catId),album:'Ρυθμός'});navigator.mediaSession.playbackState='playing';navigator.mediaSession.setActionHandler('play',function(){audToggle();});navigator.mediaSession.setActionHandler('pause',function(){audToggle();});navigator.mediaSession.setActionHandler('previoustrack',function(){audPrev();});navigator.mediaSession.setActionHandler('nexttrack',function(){audNext();});}catch(e){}}
function audSetPlayback(st){if(!('mediaSession' in navigator))return;try{navigator.mediaSession.playbackState=st;}catch(e){}}
var _apM=audPlayTrack;audPlayTrack=function(catId,tr){_apM(catId,tr);audSetMedia(tr,catId);};
var _atM=audToggle;audToggle=function(){_atM();audSetPlayback(state.audio.playing?'playing':'paused');};
function audPickTrack(catId,dir){var a=state.audio;var c=a.categories.find(function(x){return x.id===catId;});if(!c||!c.tracks.length)return null;var i=c.tracks.findIndex(function(x){return x.id===a.curTrack});var n;if(a.shuffle&&c.tracks.length>1){do{n=Math.floor(Math.random()*c.tracks.length);}while(n===i);}else{n=(i+dir+c.tracks.length)%c.tracks.length;}return c.tracks[n];}
function audPrev(){var t=audPickTrack(state.audio.curCat,-1);if(t)audPlayTrack(state.audio.curCat,t);}
audNext=function(){var t=audPickTrack(state.audio.curCat,1);if(t)audPlayTrack(state.audio.curCat,t);};
AUD_EL.addEventListener('ended',function(){if(!state.audio.loop){audNext();}});
var _oaM=openAudioSheet;openAudioSheet=function(){_oaM();var bar=document.querySelector('#modalOverlay .aud-bar');if(bar&&!bar.querySelector('.aud-shuffle')){var b=document.createElement('button');b.type='button';b.className='aud-ico aud-shuffle'+(state.audio.shuffle?' playing':'');b.setAttribute('aria-label','Shuffle');b.innerHTML=SHUFFLE_SVG;b.onclick=function(){state.audio.shuffle=!state.audio.shuffle;saveState();b.classList.toggle('playing',state.audio.shuffle);showToast(state.audio.shuffle?'Shuffle ενεργό':'Shuffle ανενεργό');};bar.appendChild(b);}};
</script>

<script>
state.sleep=state.sleep||{asleep:false,startedAt:null,hours:{}};
state.reviews=state.reviews||{};
state.reviewAsk=state.reviewAsk||'';
function sleepTodayMin(){var sl=state.sleep;var k=getDailyPlanKey();var h=(sl.hours&&sl.hours[k])?sl.hours[k]:0;if(sl.asleep&&sl.startedAt){h+=(Date.now()-Math.max(sl.startedAt,startOfDay()))/3600000;}return h*60;}
function sleepSleep(){state.sleep.asleep=true;state.sleep.startedAt=Date.now();saveState();render();}
function sleepWake(){var sl=state.sleep;if(!sl.asleep)return;var k=getDailyPlanKey();sl.hours[k]=(sl.hours[k]||0)+(Date.now()-sl.startedAt)/3600000;sl.asleep=false;sl.startedAt=null;saveState();render();}
function sleepManual(){var d=prompt('Ημερομηνία (YYYY-MM-DD):',getDailyPlanKey());if(!d)return;var h=prompt('Ώρες ύπνου:',state.settings.sleepHours);if(!h)return;state.sleep.hours[d]=clamp(parseFloat(h)||0,0,24);saveState();render();}
function sleepCardHTML(){var sl=state.sleep;var today=sleepTodayMin();var target=state.settings.sleepHours*60;var pct=target?clamp(today/target*100,0,100):0;
return '<div class="card"><h3>Ύπνος</h3><div class="metrics"><div class="metric"><span>Σήμερα</span><strong>'+fmtHM(today)+'</strong><div class="progress'+(today>target?' over':'')+'"><span style="width:'+pct+'%"></span></div><small>'+fmtHM(today)+' / '+fmtHM(target)+'</small></div><div class="metric"><span>Κατάσταση</span><strong>'+(sl.asleep?'Σε ύπνο':'Ξύπνιος')+'</strong><small>'+(sl.asleep?fmtClock(Date.now()-sl.startedAt):'—')+'</small></div></div><div class="actions">'+(sl.asleep?'<button class="btn btn-success" onclick="sleepWake()">Ξύπνησα</button>':'<button class="btn btn-primary" onclick="sleepSleep()">Πάω για ύπνο</button>')+'<button class="btn btn-ghost" onclick="sleepManual()">Χειροκίνητη καταχώρηση</button></div></div>';}
function logsTodayHTML(){var s=startOfDay(),e=startOfNextDay();var idx=[];state.logs.forEach(function(L,i){if(L.end>s&&L.start<e)idx.push(i);});if(!idx.length)return '';
var rows=idx.map(function(i){var L=state.logs[i];var nm=L.type==='course'?(state.courses.find(function(c){return c.id===L.id})||{name:'Μάθημα'}).name:(FIXED_DEFS.find(function(d){return d.id===L.id})||{name:'Δραστηριότητα'}).name;
return '<div class="list-row"><div class="list-left"><strong>'+esc(nm)+'</strong><span class="muted">'+fmtClock(L.start-s)+' – '+fmtClock(Math.min(L.end,e)-s)+'</span></div><div class="list-value">'+fmtHM(L.dur)+'</div><button class="btn btn-ghost" onclick="logEdit('+i+')">✎</button><button class="btn btn-ghost-danger" onclick="logDel('+i+')">✕</button></div>';}).join('');
return '<div class="card"><h3>Καταγραφές σήμερα</h3><div class="stack" style="margin-top:10px">'+rows+'</div></div>';}
function logDel(i){var L=state.logs[i];if(!L)return;confirmModal('Διαγραφή','Διαγραφή αυτής της καταγραφής;',function(){var k=state.logs.indexOf(L);if(k>-1)state.logs.splice(k,1);saveState();render();},'Διαγραφή');}
function logEdit(i){var L=state.logs[i];if(!L)return;var m=prompt('Νέα διάρκεια σε λεπτά:',Math.round(L.dur));if(!m)return;var mins=clamp(parseFloat(m)||0,1,1440);L.dur=mins;L.end=L.start+mins*60000;saveState();render();}
function dayCompliant(ts){var s=startOfDay(ts),e=startOfNextDay(ts);return FIXED_DEFS.every(function(d){return totalMin('fixed',d.id,s,e)<=d.daily+0.5;});}
function streakCount(){var day=86400000;var cur=startOfDay();if(!dayCompliant(cur))cur-=day;var n=0;while(n<60&&dayCompliant(cur)){n++;cur-=day;}return n;}
setInterval(function(){var h=new Date().getHours();var key=getDailyPlanKey();if(h>=21&&!state.reviews[key]&&state.reviewAsk!==key&&!modalOpen){state.reviewAsk=key;saveState();var logged=allTotalMin(startOfDay(),startOfNextDay());
openModal({title:'Απολογισμός ημέρας',body:'<p class="muted">Καταγραφή: '+fmtHM(logged)+'</p><p class="muted">Ύπνος: '+fmtHM(sleepTodayMin())+'</p><p class="muted" style="margin:10px 0 6px">Βαθμολόγησε τη μέρα:</p><div class="actions">'+[1,2,3,4,5].map(function(r){return '<button class="btn btn-ghost" onclick="rateDay('+r+')">'+r+'</button>';}).join('')+'</div>',buttons:[{text:'Παράλειψη',class:'btn-ghost'}]});}},60000);
function rateDay(r){state.reviews[getDailyPlanKey()]=r;saveState();closeModal();showToast('Καταγράφηκε βαθμολογία '+r);}
var _ss=safeSettings;safeSettings=function(){_ss();var p=document.getElementById('safePanel');if(p&&!p.querySelector('#impBtn')){var b=document.createElement('button');b.id='impBtn';b.textContent='Εισαγωγή backup';b.style.cssText='display:block;width:100%;margin-top:8px;padding:12px;border:none;border-radius:14px;background:#335533;color:#fff;font:700 .9rem system-ui,sans-serif';b.onclick=function(){var f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=function(){var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j||!j.version||!Array.isArray(j.logs)){safeToast('Μη έγκυρο αρχείο.');return;}confirmModal('Εισαγωγή','Αντικατάσταση ΟΛΩΝ των δεδομένων με το αρχείο;',function(){localStorage.setItem(STORE_KEY,r.result);location.reload();},'Εισαγωγή');}catch(e){safeToast('Σφάλμα ανάγνωσης.');}};r.readAsText(f.files[0]);};p.appendChild(b);}};
function setExam(id,v){var c=state.courses.find(function(x){return x.id===id});if(!c)return;c.examDate=v;saveState();render();}
var _ci=courseInfo;courseInfo=function(c){var r=_ci(c);if(c&&c.examDate&&r.remaining>0&&!r.isOff){var exS=startOfDay(new Date(c.examDate+'T12:00:00').getTime());var daysLeft=Math.round((exS-startOfDay())/86400000);if(daysLeft>=0&&daysLeft<=21){var act=0;for(var i=0;i<=daysLeft;i++){var wd=mondayIndex(startOfDay()+i*86400000);if(!(c.off||[]).includes(wd))act++;}var urg=1+0.5*(1-daysLeft/21);r.todayTarget=Math.min(r.remaining,Math.max(r.todayTarget,(r.remaining/Math.max(1,act))*urg));}}return r;};
function examCardHTML(){
var rows=state.courses.filter(function(c){return c.active&&c.hours>0;}).map(function(c){
return '<div class="list-row"><div class="list-left"><strong>'+esc(c.name)+'</strong></div><input type="date" style="width:auto" value="'+(c.examDate||'')+'" onchange="setExam(\''+c.id+'\',this.value)"></div>';
}).join('');
return '<div id="exam-card-extra"><div class="section-title">Εξεταστική</div><div class="card">'+(rows||'<p class="muted">Κανένα ενεργό μάθημα.</p>')+'</div></div>';
}
                                             
function sleepExtrasMount(){
var main=document.querySelector('main');
if(!main)return;

var active=document.querySelector('.nav-btn.active');
var label=active?active.textContent:'';

if(label.indexOf('Ημέρα')>=0){
 if(!document.getElementById('sleep-card-extra')){
  main.insertAdjacentHTML('beforeend','<div id="sleep-card-extra">'+sleepCardHTML()+logsTodayHTML()+'</div>');
 }
}

if(label.indexOf('Ανάλυση')>=0){
 if(!document.getElementById('streak-card-extra')){
  main.insertAdjacentHTML('afterbegin','<div id="streak-card-extra"><div class="card"><h3>Σερί συμμόρφωσης</h3><div class="stat-card"><div class="stat-value">'+streakCount()+' ημέρες</div><div class="stat-sub">διαδοχικές εντός ορίων</div></div></div></div>');
 }
}

if(label.indexOf('Δραστηριότητες')>=0){
 if(!document.getElementById('exam-card-extra')){
  main.insertAdjacentHTML('beforeend',examCardHTML());
 }
}
}

var _renderSleepExtras=render;
render=function(){
 _renderSleepExtras();
 setTimeout(sleepExtrasMount,0);
};

render();  

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(e){showToast('SW fail: '+(e&&e.message?e.message:String(e)));});}else{showToast('Ο browser δεν υποστηρίζει serviceWorker');}</script>
