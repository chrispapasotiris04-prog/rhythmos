<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ρυθμός</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#6366f1">
<meta name="app-version" content="1.4.14">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5/greek-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5/greek-500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5/greek-700.css">
<style>
:root{--text:#1e2440;--muted:#6c7499;--card:rgba(255,255,255,.84);--card-border:rgba(255,255,255,.72);--line:rgba(30,36,64,.08);--soft:#f6f8ff;--track:#e6ebfa;--primary:#6366f1;--primary2:#8b5cf6;--success:#10b981;--warn:#f59e0b;--danger:#ef4444;--shadow:0 16px 40px rgba(35,47,95,.10);--radius:28px;--body-bg:linear-gradient(135deg,#e9eeff 0%,#f8ecff 48%,#e9fff6 100%);--app-bg1:rgba(255,255,255,.72);--app-bg2:rgba(255,255,255,.58);--header-bg1:rgba(250,251,255,.96);--nav-bg:rgba(255,255,255,.84);--sheet-bg:#ffffff;--input-bg:#fbfcff;--input-border:#dfe5f5;--toast-bg:#202748;--toast-text:#fff;font-size:16px}
:root.blue{color-scheme:dark;--text:#e9edff;--muted:#98a2cc;--card:rgba(26,33,60,.82);--card-border:rgba(255,255,255,.08);--line:rgba(255,255,255,.08);--soft:rgba(255,255,255,.06);--track:rgba(255,255,255,.10);--shadow:0 18px 44px rgba(0,0,0,.38);--body-bg:linear-gradient(135deg,#080c18 0%,#171233 52%,#071018 100%);--app-bg1:rgba(13,18,36,.68);--app-bg2:rgba(9,13,28,.56);--header-bg1:rgba(9,13,28,.94);--nav-bg:rgba(10,14,30,.84);--sheet-bg:#151c34;--input-bg:rgba(255,255,255,.06);--input-border:rgba(255,255,255,.12);--toast-bg:#e9edff;--toast-text:#111827}
:root.dark{color-scheme:dark;--text:#ffffff;--muted:#9ca3af;--card:#2a2a2a;--card-border:#3a3a3a;--line:#333333;--soft:#222222;--track:#3a3a3a;--shadow:0 18px 44px rgba(0,0,0,.6);--body-bg:#0f0f0f;--app-bg1:#111111;--app-bg2:#0f0f0f;--header-bg1:#0f0f0f;--nav-bg:#111111;--sheet-bg:#1e1e1e;--input-bg:#2a2a2a;--input-border:#3a3a3a;--toast-bg:#f3f4f6;--toast-text:#111827}
html.compact{font-size:14.4px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Roboto','Noto Sans Greek',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--body-bg);min-height:100dvh}
body::before,body::after{content:'';position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none;z-index:0}
body::before{background:#8b9dff;top:-80px;left:-60px}body::after{background:#7ce7c4;bottom:-80px;right:-60px}
html.blue body::before{background:#2b3b7a;opacity:.22}html.blue body::after{background:#1f6f5c;opacity:.18}
html.dark body::before,html.dark body::after{display:none}
.app{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;min-height:100dvh;background:var(--app-bg1)}
header{position:sticky;top:0;z-index:40;padding:14px 16px 10px;background:var(--header-bg1);backdrop-filter:blur(16px)}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.header-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.header-date{color:var(--muted);font-size:.8rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focus-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:999px;padding:6px 12px;font-size:.75rem;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(99,102,241,.3);font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.focus-badge.hidden{display:none}
.gear-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--card-border);background:var(--card);color:var(--primary);display:grid;place-items:center;cursor:pointer;transition:transform .2s;flex:0 0 auto}
.gear-btn:active{transform:scale(.94) rotate(20deg)}.gear-btn svg{width:21px;height:21px}
.update-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--card-border);background:var(--card);color:var(--primary);display:grid;place-items:center;cursor:pointer;transition:transform .2s;flex:0 0 auto}
.update-btn:active{transform:scale(.94)}
.update-btn svg{width:21px;height:21px}
.update-btn.busy{opacity:.5;pointer-events:none}
html.compact .update-btn{width:36px;height:36px;border-radius:12px}
html.compact .update-btn svg{width:18px;height:18px}
main{padding:10px 16px 190px}
.card{position:relative;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);animation:fadeUp .4s both;overflow:hidden}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.accent-glow{position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--accent,#6366f1),transparent 68%);opacity:.16;pointer-events:none}
h2,h3,h4{margin:0}h3{font-size:1.03rem}p{margin:0}
.muted{color:var(--muted);font-size:.84rem;line-height:1.35}
.note{color:var(--muted);font-size:.78rem;margin-top:10px;line-height:1.4}
.section-title{font-size:1.05rem;font-weight:700;margin:20px 6px 10px}
.text-danger{color:var(--danger)}.text-success{color:#047857}.text-warn{color:#b45309}
html.blue .text-danger,html.dark .text-danger{color:#fca5a5}
html.blue .text-success,html.dark .text-success{color:#6ee7b7}
html.blue .text-warn,html.dark .text-warn{color:#fcd34d}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.ring-wrap{position:relative;width:132px;height:132px;flex:0 0 auto}
.ring-wrap svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--track);stroke-width:12}
.ring-fg{fill:none;stroke:url(#homeGrad);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .7s ease}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center strong{font-size:1.12rem;line-height:1.1}.ring-center span{font-size:.72rem;color:var(--muted);margin-top:3px}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat-box{background:var(--soft);border-radius:22px;padding:12px}
.stat-box span{display:block;color:var(--muted);font-size:.74rem;margin-bottom:5px}.stat-box strong{font-size:1rem}
.stack-bar{display:flex;height:18px;border-radius:999px;overflow:hidden;background:var(--track);margin:14px 0 10px}
.stack-bar div{height:100%}
.plan-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:.88rem}
.plan-row strong{font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.activity-head{display:flex;align-items:flex-start;gap:12px}
.icon{width:46px;height:46px;min-width:46px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.05rem;background:linear-gradient(135deg,var(--accent,#6366f1),var(--accent2,#8b5cf6));box-shadow:0 10px 22px rgba(31,41,90,.15)}
.activity-title{flex:1;min-width:0}.activity-title h3{margin-bottom:4px;font-size:1rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.pill.info{background:rgba(99,102,241,.12);color:#4338ca}.pill.success{background:rgba(16,185,129,.14);color:#047857}
.pill.warn{background:rgba(245,158,11,.16);color:#b45309}.pill.danger{background:rgba(239,68,68,.12);color:#b91c1c}
html.blue .pill.info,html.dark .pill.info{background:rgba(99,102,241,.22);color:#c7d2fe}
html.blue .pill.success,html.dark .pill.success{background:rgba(16,185,129,.18);color:#6ee7b7}
html.blue .pill.warn,html.dark .pill.warn{background:rgba(245,158,11,.18);color:#fcd34d}
html.blue .pill.danger,html.dark .pill.danger{background:rgba(239,68,68,.18);color:#fca5a5}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.metric{background:var(--soft);border-radius:20px;padding:10px;min-width:0}
.metric span{display:block;color:var(--muted);font-size:.68rem;margin-bottom:5px}
.metric strong{display:block;font-size:.88rem;margin-bottom:7px;word-break:break-word}
.metric small{display:block;color:var(--muted);font-size:.68rem;margin-top:5px}
.progress{height:9px;border-radius:999px;background:var(--track);overflow:hidden}
.progress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent,#6366f1),var(--accent2,#8b5cf6));transition:width .6s ease}
.progress.over span{background:linear-gradient(90deg,#f97316,#ef4444)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:none;border-radius:999px;padding:11px 16px;font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer;transition:transform .16s,box-shadow .16s,opacity .16s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 10px 22px rgba(99,102,241,.24)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 10px 22px rgba(16,185,129,.2)}
.btn-stop{background:linear-gradient(135deg,#fb7185,#ef4444);color:#fff;box-shadow:0 10px 22px rgba(239,68,68,.2)}
.btn-warn{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#452700;box-shadow:0 10px 22px rgba(245,158,11,.18)}
.btn-ghost{background:rgba(99,102,241,.1);color:#4f46e5}.btn-ghost-danger{background:rgba(239,68,68,.1);color:#dc2626}
html.blue .btn-ghost,html.dark .btn-ghost{background:rgba(99,102,241,.18);color:#c7d2fe}
html.blue .btn-ghost-danger,html.dark .btn-ghost-danger{background:rgba(239,68,68,.16);color:#fca5a5}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.list-left{min-width:0;flex:1}.list-left strong{display:block;font-size:.88rem;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-value{font-size:.8rem;font-weight:700;white-space:nowrap}
.day-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.day-chip{width:32px;height:28px;border-radius:12px;display:inline-grid;place-items:center;font-size:.68rem;font-weight:700;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.day-chip.on{background:linear-gradient(135deg,var(--accent,#6366f1),var(--accent2,#8b5cf6));color:#fff;border-color:transparent}
.day-chip.today{outline:2px solid rgba(99,102,241,.35)}
.day-row{display:flex;gap:8px;flex-wrap:wrap}
.day-btn{width:44px;height:44px;border-radius:16px;border:1px solid var(--line);background:var(--soft);color:var(--muted);font-weight:700;cursor:pointer;transition:.2s}
.day-btn.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(99,102,241,.22)}
.chart{position:relative;height:112px;display:flex;align-items:flex-end;gap:8px;margin:12px 0 8px}
.threshold{position:absolute;left:0;right:0;border-top:2px dashed rgba(239,68,68,.32);pointer-events:none}
.bar-col{flex:1;height:100%;display:flex;align-items:flex-end}
.bar{width:100%;border-radius:999px 999px 14px 14px;background:linear-gradient(180deg,#a5b4fc,#6366f1);min-height:5px;transition:height .6s}
.bar.danger{background:linear-gradient(180deg,#fca5a5,#ef4444)}.bar.today{box-shadow:0 0 0 3px rgba(99,102,241,.16)}
.chart-labels{display:flex;gap:8px}
.chart-labels span{flex:1;text-align:center;font-size:.72rem;color:var(--muted);font-weight:700}
.chart-labels span.today{color:var(--primary)}
.choice-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:12px;cursor:pointer;transition:.2s;color:var(--text)}
.choice.on{border-color:rgba(99,102,241,.45);background:rgba(99,102,241,.08)}
.choice strong{display:block;font-size:.9rem}.choice small{color:var(--muted);font-size:.75rem}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:none}.setting-row strong{display:block;font-size:.92rem;margin-bottom:4px}
.switch{width:54px;height:32px;min-width:54px;border-radius:999px;background:var(--track);position:relative;border:none;cursor:pointer;transition:.25s}
.switch::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.16);transition:.25s}
.switch.on{background:linear-gradient(135deg,var(--primary),var(--primary2))}.switch.on::after{transform:translateX(22px)}
.appearance-label{font-size:.78rem;font-weight:700;color:var(--muted);margin:0 0 8px}
.appearance-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.appearance-choice{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:14px 12px;cursor:pointer;text-align:left;transition:.2s;color:var(--text)}
.appearance-choice strong{display:block;margin-bottom:4px;font-size:.95rem}.appearance-choice small{color:var(--muted);font-size:.78rem}
.appearance-choice.on{border-color:rgba(99,102,241,.55);background:rgba(99,102,241,.12);box-shadow:0 8px 20px rgba(99,102,241,.14)}
input,select{width:100%;padding:13px 14px;border-radius:18px;border:1px solid var(--input-border);background:var(--input-bg);font-family:inherit;font-size:16px;color:var(--text)}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.field{margin-bottom:14px}label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.form-error{display:none;color:#b91c1c;background:rgba(239,68,68,.08);border-radius:16px;padding:10px;font-size:.84rem;margin-bottom:12px}
.form-error.show{display:block}html.blue .form-error,html.dark .form-error{color:#fca5a5;background:rgba(239,68,68,.14)}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.preset{border:1px solid var(--line);background:var(--soft);color:var(--primary);border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:700;cursor:pointer}
.empty{text-align:center;padding:28px 16px}
.empty-icon{width:68px;height:68px;border-radius:28px;margin:0 auto 14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 14px 28px rgba(99,102,241,.22)}
.slot-empty{border:2px dashed rgba(99,102,241,.28);box-shadow:none;background:var(--card)}
#runningDock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:402px;z-index:60;pointer-events:none}
.dock-card{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:13px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#262e52,#4a3f7c);box-shadow:0 18px 42px rgba(23,30,61,.34);animation:fadeUp .3s both}
html.blue .dock-card,html.dark .dock-card{background:linear-gradient(135deg,#1a1a1a,#2a2a2a)}
.dock-info{flex:1;min-width:0}.dock-info span{display:block;font-size:.74rem;opacity:.76;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-info strong{font-size:1.25rem;letter-spacing:.5px}.dock-info small{display:block;font-size:.72rem;opacity:.78;margin-top:4px}
.dock-progress{height:5px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:8px}
.dock-progress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#34d399,#a5b4fc);width:0;transition:width .6s}
.dock-stop{padding:9px 13px;font-size:.82rem}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:70;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:var(--nav-bg);backdrop-filter:blur(22px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;color:var(--muted);font-family:inherit;font-size:.6rem;font-weight:700;cursor:pointer;transition:.2s}
.nav-btn svg{width:20px;height:20px}.nav-btn.active{color:var(--primary);background:rgba(99,102,241,.1)}
#modalOverlay{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(5px)}
#modalOverlay.open{display:flex}
.sheet{width:100%;max-width:430px;max-height:88dvh;overflow:auto;background:var(--sheet-bg);color:var(--text);border-radius:34px 34px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom));animation:sheetUp .28s ease both}
@media(min-width:431px){#modalOverlay{align-items:center}.sheet{border-radius:34px;max-height:82dvh}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:46px;height:5px;border-radius:999px;background:var(--track);margin:0 auto 14px}
.sheet h3{font-size:1.15rem;margin-bottom:8px}
.modal-message{color:var(--muted);font-size:.92rem;line-height:1.5;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.modal-actions .btn{flex:1;min-width:120px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--toast-bg);color:var(--toast-text);padding:11px 18px;border-radius:999px;font-size:.86rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:.68rem;font-weight:700;background:rgba(99,102,241,.12);color:#4338ca}
.badge.warn{background:rgba(245,158,11,.14);color:#b45309}
html.blue .badge,html.dark .badge{background:rgba(99,102,241,.22);color:#c7d2fe}
html.blue .badge.warn,html.dark .badge.warn{background:rgba(245,158,11,.2);color:#fcd34d}
.overdue{border-color:rgba(239,68,68,.25);box-shadow:0 16px 38px rgba(239,68,68,.12)}
.timeline{position:relative;margin:14px 0 8px;padding-left:18px}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--track);border-radius:2px}
.timeline-item{position:relative;margin-bottom:14px;padding-left:18px}
.timeline-item::before{content:'';position:absolute;left:-15px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent,#6366f1);border:2px solid var(--card);box-shadow:0 0 0 2px var(--accent,#6366f1)}
.timeline-item.done::before{background:var(--success)}
.timeline-item.rest::before{background:var(--muted);box-shadow:0 0 0 2px var(--muted)}
.timeline-time{font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:2px}
.timeline-title{font-size:.88rem;font-weight:700}
.timeline-dur{font-size:.72rem;color:var(--muted)}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.quick-btn{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:10px 6px;text-align:center;cursor:pointer;transition:.2s;color:var(--text)}
.quick-btn:active{transform:scale(.95)}
.quick-btn .qicon{width:36px;height:36px;border-radius:14px;margin:0 auto 6px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.9rem;background:linear-gradient(135deg,var(--accent,#6366f1),var(--accent2,#8b5cf6))}
.quick-btn span{display:block;font-size:.68rem;font-weight:700;line-height:1.2}
.heavy-warning{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:20px;padding:12px;margin:12px 0}

function overlap(aS,aE,bS,bE){return Math.max(0,Math.min(aE,bE)-Math.max(aS,bS));}
function pruneLogs(){const cutoff=Date.now()-400*86400000;state.logs=state.logs.filter(l=>l.end>=cutoff);}
function addLogSplit(type,id,start,end){let cur=start;while(cur<end){const next=startOfNextDay(cur);const segEnd=Math.min(end,next);state.logs.push({type,id,start:cur,end:segEnd,dur:(segEnd-cur)/60000});cur=segEnd;}pruneLogs();}
function totalMin(type,id,from,to){let s=state.logs.reduce((acc,l)=>{if(l.type===type&&l.id===id)return acc+overlap(l.start,l.end,from,to)/60000;return acc;},0);const a=state.active;if(a&&a.type===type&&a.id===id)s+=overlap(a.start,Date.now(),from,to)/60000;return s;}

function occurrences(type,id,from,to){const days=new Set();state.logs.forEach(l=>{if(l.type===type&&l.id===id&&l.dur>0.01&&overlap(l.start,l.end,from,to)>0)days.add(startOfDay(l.start));});const a=state.active;if(a&&a.type===type&&a.id===id){const s=Math.max(a.start,from),e=Math.min(Date.now(),to);if(e>s)days.add(startOfDay(a.start));}return days.size;}

function fmtHM(min){if(!isFinite(min))return '—';const neg=min<-0.5;const m=Math.abs(Math.round(min));const h=Math.floor(m/60),mm=m%60;let out;if(h===0)out=mm+'λ';else if(mm===0)out=h+'ω';else out=h+'ω '+mm+'λ';return (neg?'−':'')+out;}
function fmtPrecise(min){const abs=Math.abs(min);const h=Math.floor(abs/60),m=Math.floor(abs%60),s=Math.round((abs*60)%60);if(h>0)return s?`${h}ω ${m}λ ${s}δ`:`${h}ω ${m}λ`;if(s>0)return `${m}λ ${s}δ`;return `${Math.round(abs)}λ`;}

function relaxBaseDaily(){const d=FIXED_DEFS.find(x=>x.id==='relax');return d?d.weekly/7:RELAX_WEEK/7;}

function relaxOversUsed(includeToday){const base=relaxBaseDaily();const ws=startOfWeek();const today=startOfDay();let count=0;for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);const ds=d.getTime();if(ds>today)continue;if(includeToday===false&&ds>=today)continue;const m=totalMin('fixed','relax',ds,startOfNextDay(ds));if(m>base+0.5)count++;}return count;}
function fixedInfo(id){const def=FIXED_DEFS.find(d=>d.id===id);if(!def)return null;const dayMin=totalMin('fixed',id,startOfDay(),startOfNextDay());const weekMin=totalMin('fixed',id,startOfWeek(),startOfNextWeek());const occ=occurrences('fixed',id,startOfWeek(),startOfNextWeek());let dailyCap=def.daily,weeklyCap=def.weekly,hardLimit=Infinity,extra={};if(id==='relax'){const base=relaxBaseDaily();const allowed=state.settings.relaxOvers;const oversBefore=relaxOversUsed(false);const oversDisplay=relaxOversUsed(true);const canOver=oversBefore<allowed;dailyCap=base;weeklyCap=def.weekly;hardLimit=canOver?base*2:base;extra={base,double:base*2,overs:oversDisplay,oversBefore,allowed,canOver,weeklyMax:def.weekly+allowed*base};}else if(def.hard){hardLimit=dailyCap;}return {def,dayMin,weekMin,occ,dailyCap,weeklyCap,hardLimit,dayRemaining:dailyCap-dayMin,dayOver:Math.max(0,dayMin-dailyCap),weekRemaining:weeklyCap-weekMin,weekOver:Math.max(0,weekMin-weeklyCap),target:def.target,...extra};}
function courseInfo(c){const dayMin=totalMin('course',c.id,startOfDay(),startOfNextDay());const weekMin=totalMin('course',c.id,startOfWeek(),startOfNextWeek());const targetMin=(c.hours||0)*60;const off=Array.isArray(c.off)?c.off:[];const activeDays=Math.max(1,7-off.length);const dailyTarget=targetMin/activeDays;const today=mondayIndex();const isOff=off.includes(today);let remActive=0;for(let i=today;i<7;i++)if(!off.includes(i))remActive++;const remaining=Math.max(0,targetMin-weekMin);const todayTarget=(!isOff&&remActive>0&&remaining>0)?Math.min(dailyTarget,remaining/remActive):0;return {course:c,dayMin,weekMin,targetMin,remaining,dailyTarget,todayTarget,isOff,off,activeDays,remActive};}
function budgetSnapshot(courses,fixedDefs,sleepHours){const sleepW=sleepHours*7*60;const fixedW=fixedDefs.reduce((s,d)=>s+d.weekly,0);const courseW=courses.filter(c=>c.active&&c.hours>0).reduce((s,c)=>s+c.hours*60,0);const weekRem=10080-sleepW-fixedW-courseW;const fixedDay=fixedW/7;const loads=[0,0,0,0,0,0,0];courses.forEach(c=>{if(!c.active||!c.hours)return;const off=Array.isArray(c.off)?c.off:[];const activeDays=Math.max(1,7-off.length);const per=c.hours*60/activeDays;for(let d=0;d<7;d++)if(!off.includes(d))loads[d]+=per;});const days=loads.map(l=>1440-sleepHours*60-fixedDay-l);return {weekRem,days};}

function getDayLoad(dayIndex){const ws=startOfWeek();const d=new Date(ws);d.setDate(d.getDate()+dayIndex);const ds=d.getTime();const de=startOfNextDay(ds);let load=0;FIXED_DEFS.forEach(def=>{load+=totalMin('fixed',def.id,ds,de);});state.courses.forEach(c=>{if(c.active&&c.hours>0&&!c.off.includes(dayIndex))load+=totalMin('course',c.id,ds,de);});return load;}

function getQuickActions(){const quickIds=['gym','food','reading','relax'].filter(id=>FIXED_DEFS.some(d=>d.id===id));FIXED_DEFS.forEach(d=>{if(quickIds.length<4&&!quickIds.includes(d.id))quickIds.push(d.id);});return quickIds.map(id=>{const def=FIXED_DEFS.find(d=>d.id===id);if(!def)return null;const info=fixedInfo(id);const isActive=state.active&&state.active.type==='fixed'&&state.active.id===id;const otherActive=state.active&&!isActive;return {def,info,isActive,otherActive,canStart:!otherActive&&(!info.def.hard||info.dayMin<info.hardLimit-0.05)};}).filter(Boolean);}
function getTodayTimeline(){const ds=startOfDay();const de=startOfNextDay(ds);const items=[];state.logs.forEach(l=>{if(l.end<=ds||l.start>=de)return;const s=Math.max(l.start,ds),e=Math.min(l.end,de);let name='';let color='#6366f1';if(l.type==='fixed'){const def=FIXED_DEFS.find(d=>d.id===l.id);if(def){name=def.name;color=def.color;}}else if(l.type==='course'){const c=state.courses.find(x=>x.id===l.id);if(c){name=c.name;color=c.color;}}items.push({start:s,end:e,dur:(e-s)/60000,name,color,type:l.type});});const a=state.active;if(a&&a.start<de&&a.start>=ds){let name='';let color='#6366f1';if(a.type==='fixed'){const def=FIXED_DEFS.find(d=>d.id===a.id);if(def){name=def.name;color=def.color;}}else if(a.type==='course'){const c=state.courses.find(x=>x.id===a.id);if(c){name=c.name;color=c.color;}}items.push({start:a.start,end:Date.now(),dur:(Date.now()-a.start)/60000,name,color,type:a.type,active:true});}state.courses.forEach(c=>{if(!c.active||!c.hours||c.off.includes(mondayIndex()))return;const dayMin=totalMin('course',c.id,ds,de);const info=courseInfo(c);if(info.todayTarget>dayMin+0.5){items.push({start:null,end:null,dur:info.todayTarget-dayMin,name:c.name,color:c.color,type:'course',planned:true});}});items.sort((a,b)=>((a.start===null)?Infinity:a.start)-((b.start===null)?Infinity:b.start));return items;}
function getWeeklyFixedData(){const ws=startOfWeek();const data=[];for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);const ds=d.getTime();const de=startOfNextDay(ds);const day={day:DAY_SHORT[i],total:0,items:[]};FIXED_DEFS.forEach(def=>{const m=totalMin('fixed',def.id,ds,de);if(m>0.5){day.items.push({name:def.name,min:m,color:def.color});day.total+=m;}});state.courses.forEach(c=>{if(!c.active||!c.hours)return;const m=totalMin('course',c.id,ds,de);if(m>0.5){day.items.push({name:c.name,min:m,color:c.color});day.total+=m;}});data.push(day);}return data;}
function getStats4Weeks(){const now=Date.now();const fourWeeks=28*86400000;const from=now-fourWeeks;const stats={};FIXED_DEFS.forEach(def=>{const total=totalMin('fixed',def.id,from,now);const days=new Set();state.logs.forEach(l=>{if(l.type==='fixed'&&l.id===def.id&&l.dur>0.01&&l.start>=from){days.add(Math.floor((l.start-from)/86400000));}});const avg=days.size>0?total/days.size:0;const prev2Weeks=totalMin('fixed',def.id,from-fourWeeks/2,from);const trend=prev2Weeks>0?((total-prev2Weeks)/prev2Weeks*100):0;const dayTotals={};state.logs.forEach(l=>{if(l.type==='fixed'&&l.id===def.id&&l.start>=from){const k=startOfDay(l.start);dayTotals[k]=(dayTotals[k]||0)+l.dur;}});const overCount=Object.keys(dayTotals).filter(k=>dayTotals[k]>def.daily+0.5).length;stats[def.id]={total,avg,days:days.size,trend,overCount};});return stats;}
function getDailyPlanKey(ts){const d=new Date(ts||Date.now());return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}

function timeToMinutes(t){if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+m;}
function checkPlanOverlaps(plan){const overlaps=[];for(let i=0;i<plan.length;i++){for(let j=i+1;j<plan.length;j++){const a=plan[i],b=plan[j];if(!a.startTime||!a.endTime||!b.startTime||!b.endTime)continue;const aS=timeToMinutes(a.startTime),aE=timeToMinutes(a.endTime),bS=timeToMinutes(b.startTime),bE=timeToMinutes(b.endTime);if(aS<bE&&bS<aE)overlaps.push({i,j});}}return overlaps;}
function getSmartSuggestions(){const suggestions=[];const today=mondayIndex();const ds=startOfDay();const de=startOfNextDay(ds);const awakeMin=1440-state.settings.sleepHours*60;const logged=allTotalMin(ds,de);const freeTime=awakeMin-logged;const currentHour=new Date().getHours();if(freeTime<30)return suggestions;state.courses.forEach(c=>{if(!c.active||!c.hours||c.off.includes(today))return;const info=courseInfo(c);if(info.remaining>60){const priority=info.remaining>180?'high':info.remaining>120?'medium':'low';suggestions.push({type:'course',id:c.id,name:c.name,duration:Math.min(info.remaining,freeTime),priority,reason:`Χρειάζεσαι ${fmtHM(info.remaining)} ακόμα`,timeOk:true});}});FIXED_DEFS.forEach(def=>{const info=fixedInfo(def.id);const [sH,eH]=def.timeRange||[0,24];const timeOk=currentHour>=sH&&currentHour<eH;if(def.target&&info.occ<def.target&&timeOk){suggestions.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(def.daily,freeTime),priority:'medium',reason:`${info.occ}/${def.target} φορές`,timeOk});}if(def.id==='walk'&&info.dayRemaining>60&&timeOk&&!(def.target&&info.occ<def.target)){suggestions.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(120,freeTime),priority:'low',reason:'Δικαίωμα βόλτας',timeOk});}if(def.id==='relax'&&info.dayRemaining>30&&timeOk){suggestions.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(info.dayRemaining,freeTime),priority:'low',reason:'Χαλάρωση',timeOk});}});suggestions.sort((a,b)=>{if(a.timeOk!==b.timeOk)return b.timeOk-a.timeOk;const p={high:3,medium:2,low:1};return p[b.priority]-p[a.priority];});return suggestions.slice(0,3);}
function generateWeeklyReview(){const ws=startOfWeek();const we=startOfNextWeek();const now=Date.now();if(now<we-2*3600000)return null;const weekKey=`${shortDate(ws)}-${shortDate(we-86400000)}`;if(state.weeklyReviews.find(r=>r.key===weekKey))return null;const totalStudy=state.courses.filter(c=>c.active&&c.hours>0).reduce((s,c)=>s+totalMin('course',c.id,ws,we),0);const targetStudy=state.courses.filter(c=>c.active&&c.hours>0).reduce((s,c)=>s+c.hours*60,0);let complianceDays=0,totalDays=0;for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);const ds=d.getTime();const de=startOfNextDay(ds);let ok=true;FIXED_DEFS.forEach(def=>{if(totalMin('fixed',def.id,ds,de)>def.daily+0.5)ok=false;});totalDays++;if(ok)complianceDays++;}const relaxTotal=totalMin('fixed','relax',ws,we);const relaxOvers=relaxOversUsed(true);const gymTotal=totalMin('fixed','gym',ws,we);const gymOcc=occurrences('fixed','gym',ws,we);const review={key:weekKey,date:now,stats:{study:{total:totalStudy,target:targetStudy,pct:targetStudy>0?totalStudy/targetStudy*100:0},compliance:{days:complianceDays,total:totalDays,rate:totalDays>0?complianceDays/totalDays*100:0},relax:{total:relaxTotal,overs:relaxOvers},gym:{total:gymTotal,occurrences:gymOcc},suggestions:[]}};if(review.stats.study.pct<90)review.stats.suggestions.push(`Αύξησε τη μελέτη κατά ${fmtHM(targetStudy-totalStudy)}`);if(review.stats.compliance.rate<80)review.stats.suggestions.push('Μείνε εντός ορίων περισσότερο');if(relaxOvers>0)review.stats.suggestions.push(`Μείωσε υπερβάσεις χαλάρωσης (${relaxOvers})`);if(gymOcc<4)review.stats.suggestions.push(`Γυμναστήριο ${4-gymOcc} φορές ακόμα`);state.weeklyReviews.push(review);state.lastReviewCheck=now;saveState();return review;}

}
function openPomodoroSetup(){
  const p=P();const pm=PM();
  if(p.phase){pushAlert({title:'Τρέχει ήδη pomodoro',message:'Τερμάτισε το τρέχον πριν ξεκινήσεις νέο.',buttons:[{text:'Εντάξει'}]});return;}
  const eligible=eligibleCoursesToday();
  const opts=[];
  /* Τελευταία επιλογή μόνο αν είναι μάθημα και παραμένει επιλέξιμο σήμερα */
  let lastOpt=null;
  if(p.lastActivity&&p.lastActivity.type==='course'){
    const c=eligible.find(x=>x.id===p.lastActivity.id);
    if(c)lastOpt={type:'course',id:c.id,name:c.name,meta:`Τελευταία επιλογή · Υπόλοιπο ${fmtHM(courseInfo(c).remaining)}`,color:c.color,color2:c.color2,short:c.name.charAt(0),last:true};
  }
  if(lastOpt)opts.push(lastOpt);

    .sort((a,b)=>courseInfo(b).remaining-courseInfo(a).remaining)
    .forEach(c=>{const info=courseInfo(c);opts.push({type:'course',id:c.id,name:c.name,meta:`Υπόλοιπο ${fmtHM(info.remaining)}`,color:c.color,color2:c.color2,short:c.name.charAt(0)});});
  /* Ελεύθερο focus στο τέλος */
  opts.push({type:null,id:null,name:'Ελεύθερο focus',meta:'Χωρίς καταγραφή χρόνου',color:'#64748b',color2:'#475569',short:'—'});
  /* Επικύρωση επιλογής: αγνόηση παλιών fixed επιλογών και μη επιλέξιμων */
  if(pomoSel.type==='fixed')pomoSel={type:null,id:null};
  const inList=opts.some(o=>o.type===pomoSel.type&&o.id===pomoSel.id);
  if(!inList){
    if(lastOpt)pomoSel={type:lastOpt.type,id:lastOpt.id};
    else if(eligible.length)pomoSel={type:'course',id:eligible.sort((a,b)=>courseInfo(b).remaining-courseInfo(a).remaining)[0].id};
    else pomoSel={type:null,id:null};
  }
  const body=`
    <p class="muted" style="margin-bottom:12px">${state.active?`Τρέχει ήδη «${state.active.type==='course'?(state.courses.find(x=>x.id===state.active.id)||{name:''}).name:(FIXED_DEFS.find(d=>d.id===state.active.id)||{name:''}).name}». Θα σταματήσει και θα καταγραφεί.`:'Διάλεξε μάθημα. Ο χρόνος θα καταγραφεί εκεί.'}</p>
    <div id="pomoOpts">${opts.map((o,i)=>`<button type="button" class="pomo-option ${((pomoSel.type===o.type)&&(pomoSel.id===o.id))?'on':''}" data-pi="${i}" style="--accent:${o.color};--accent2:${o.color2}" onclick="pomoPick(${i},${o.type===null?'null':`'${o.type}'`},${o.id===null||o.id===undefined?'null':`'${o.id}'`})">
      <span class="picon">${o.short}</span>
      <span class="pmid"><span class="pname">${esc(o.name)}${o.last?' <span class="badge">Τελευταίο</span>':''}</span>${o.meta?`<span class="pmeta">${o.meta}</span>`:''}</span>
    </button>`).join('')}</div>
    <p class="note" style="margin:4px 0 14px">Τα σημερινά ρεπό μαθημάτων δεν εμφανίζονται.</p>
    <div class="field"><label>Διάρκεια focus</label>
      <div class="stepper-row"><button type="button" class="step-btn" onclick="pomoAdjust('focus',-5)">−5</button><input id="pomoFocus" type="number" min="5" max="120" step="1" value="${pm.focusMin}" onchange="pomoSet('focus',this.value)"><button type="button" class="step-btn" onclick="pomoAdjust('focus',5)">+5</button><span class="unit">λεπτά</span></div>
      <div class="preset-row" style="margin-top:8px"><button type="button" class="preset" onclick="pomoPreset(25,5)">25/5</button><button type="button" class="preset" onclick="pomoPreset(50,10)">50/10</button><button type="button" class="preset" onclick="pomoPreset(15,3)">15/3</button><button type="button" class="preset" onclick="pomoPreset(90,20)">90/20</button></div>
    </div>

    </div>

    </div>`;
  openModal({title:'Νέος κύκλος Pomodoro',body,buttons:[{text:'Ακύρωση',class:'btn-ghost'},{text:'Έναρξη',class:'btn-primary',close:false,onClick:()=>{startPomodoro();}}]});
}
function pomoPick(i,type,id){pomoSel={type:type||null,id:id||null};document.querySelectorAll('.pomo-option').forEach(el=>el.classList.toggle('on',el.dataset.pi===String(i)));}
function pomoSet(kind,val){const pm=PM();if(kind==='focus')pm.focusMin=clamp(parseInt(val)||25,5,120);if(kind==='break')pm.breakMin=clamp(parseInt(val)||5,1,30);if(kind==='long')pm.longBreakMin=clamp(parseInt(val)||20,5,60);saveState();const el=kind==='focus'?$('#pomoFocus'):kind==='break'?$('#pomoBreak'):$('#pomoLong');if(el)el.value=kind==='focus'?pm.focusMin:kind==='break'?pm.breakMin:pm.longBreakMin;}
function pomoAdjust(kind,delta){const pm=PM();if(kind==='focus')pomoSet('focus',pm.focusMin+delta);if(kind==='break')pomoSet('break',pm.breakMin+delta);if(kind==='long')pomoSet('long',pm.longBreakMin+delta);}
function pomoPreset(f,b){pomoSet('focus',f);pomoSet('break',b);}
function startPomodoro(){
  const pm=PM();const p=P();
  if(state.active)endSession(true);
  p.phase='focus';p.activityType=pomoSel.type;p.activityId=pomoSel.id;p.cycleCount=0;p.phaseEndsAt=Date.now()+pm.focusMin*60000;
  p.lastActivity=pomoSel.type?{type:pomoSel.type,id:pomoSel.id}:null;
  saveState();closeModal();
  if(pomoSel.type)doStart(pomoSel.type,pomoSel.id);else render();
  openFocusOverlay();
}
function endSession(silent){if(!state.active)return;const a=state.active;const end=Date.now();if(end>a.start+500)addLogSplit(a.type,a.id,a.start,end);state.active=null;saveState();if(!silent)render();}
function completeFocus(){
  const p=P();endSession(true);p.cycleCount++;
  const long=p.cycleCount%4===0;const dur=long?PM().longBreakMin:PM().breakMin;
  p.phase=long?'longbreak':'break';p.phaseEndsAt=Date.now()+dur*60000;saveState();
  beep();
  pushAlert({title:long?'🎉 Μεγάλο διάλειμμα':'☕ Διάλειμμα',message:`Ολοκλήρωσες ${p.cycleCount} κύκλο(ους) στο ${pomoActivityName()}. Ξεκίνησε διάλειμμα ${dur}λ.`,buttons:[{text:'Παράλειψη',class:'btn-ghost',onClick:()=>skipToProposal()},{text:'Εντάξει'}]});
  render();updateFocusOverlay(true);
}
function skipToProposal(){const p=P();p.phase='proposal';p.phaseEndsAt=0;saveState();render();updateFocusOverlay(true);}
function completeBreak(){const p=P();p.phase='proposal';p.phaseEndsAt=0;saveState();beep();
  pushAlert({title:'⏰ Τέλος διαλείμματος',message:`Νέος κύκλος στο ${pomoActivityName()};`,buttons:[{text:'Νέος κύκλος',class:'btn-primary',onClick:()=>startNextCycle()},{text:'Αλλαγή',class:'btn-ghost',onClick:()=>openPomodoroSetup()},{text:'Τέλος',class:'btn-ghost',onClick:()=>abortPomodoro()}]});
  render();updateFocusOverlay(true);}
function startNextCycle(){const p=P();const la=p.lastActivity;p.phase='focus';p.phaseEndsAt=Date.now()+PM().focusMin*60000;saveState();if(la&&la.type){endSession(true);doStart(la.type,la.id);}closeModal();render();openFocusOverlay();}
function abortPomodoro(silent){const p=P();if(p.phase==='focus')endSession(true);p.phase=null;p.phaseEndsAt=0;saveState();closeFocusOverlay();if(!silent){showToast('Το pomodoro τερματίστηκε.');}render();}
function finishFocusEarly(){completeFocus();}
function openFocusOverlay(){const p=P();if(!p.phase){openPomodoroSetup();return;}$('#focusOverlay').classList.remove('hidden');updateFocusOverlay(true);}
function closeFocusOverlay(){$('#focusOverlay').classList.add('hidden');}
function updateFocusOverlay(force){
  const p=P();const ov=$('#focusOverlay');if(!ov)return;
  if(!p.phase){ov.classList.add('hidden');foLastPhase='';return;}
  if(!ov.classList.contains('hidden')||force){
    const label=$('#foLabel'),act=$('#foActivity'),timer=$('#foTimer'),dots=$('#foDots'),acts=$('#foActions');
    if(p.phase==='focus'){label.textContent='Focus';act.textContent=pomoActivityName();}
    else if(p.phase==='break'){label.textContent='Διάλειμμα';act.textContent=pomoActivityName();}
    else if(p.phase==='longbreak'){label.textContent='Μεγάλο διάλειμμα';act.textContent=pomoActivityName();}
    else{label.textContent='Έτοιμος για νέο κύκλο';act.textContent=pomoActivityName();}
    timer.textContent=p.phase==='proposal'?'—':fmtClock(pomoPhaseRemaining());
    let filled=p.cycleCount%4;if(filled===0&&p.cycleCount>0&&p.phase!=='focus')filled=4;
    dots.innerHTML=[0,1,2,3].map(i=>`<div class="pomo-dot ${i<filled?'filled':''}"></div>`).join('');
    if(foLastPhase!==p.phase){
      foLastPhase=p.phase;
      if(p.phase==='focus')acts.innerHTML=`<button class="btn btn-success" onclick="finishFocusEarly()">Ολοκλήρωση κύκλου</button><button class="btn btn-stop" onclick="abortPomodoro()">Τερματισμός</button>`;
      else if(p.phase==='break'||p.phase==='longbreak')acts.innerHTML=`<button class="btn btn-primary" onclick="skipToProposal()">Παράλειψη</button><button class="btn btn-stop" onclick="abortPomodoro()">Τερματισμός</button>`;
      else acts.innerHTML=`<button class="btn btn-primary" onclick="startNextCycle()">Νέος κύκλος</button><button class="btn btn-ghost" onclick="openPomodoroSetup()">Αλλαγή</button><button class="btn btn-stop" onclick="abortPomodoro()">Τέλος</button>`;
    }
  }
}
function updateFocusBadge(){
  const b=$('#focusBadge');if(!b)return;const p=P();
  if(p.phase==='focus'||p.phase==='break'||p.phase==='longbreak'){
    b.textContent=(p.phase==='focus'?'🎯 ':'☕ ')+fmtClock(pomoPhaseRemaining());

function openPlanEditor(){
  const todayPlan=getTodayPlan();const overlaps=checkPlanOverlaps(todayPlan);
  let body=`<div id="planSlots">`;
  if(todayPlan.length===0){body+=`<div class="empty" style="padding:20px"><p class="muted">Δεν έχεις προγραμματίσει τίποτα.</p></div>`;}
  else{todayPlan.forEach((slot,i)=>{const isOv=overlaps.some(o=>o.i===i||o.j===i);body+=`<div class="plan-slot ${isOv?'overlap':''}"><div class="plan-slot-header"><strong>${slot.name||'Νέα'}</strong><button class="btn btn-ghost-danger" style="padding:6px 10px;font-size:.72rem" onclick="removePlanSlot(${i})">✕</button></div>
    <div class="time-inputs"><input type="time" value="${slot.startTime||'08:00'}" onchange="updatePlanSlot(${i},'startTime',this.value)"><span class="muted">έως</span><input type="time" value="${slot.endTime||'09:00'}" onchange="updatePlanSlot(${i},'endTime',this.value)"></div>
    <div style="margin-top:8px"><select onchange="updatePlanSlot(${i},'activityId',this.value)"><option value="">-- Επίλεξε --</option>${FIXED_DEFS.map(d=>`<option value="fixed:${d.id}" ${slot.activityId===`fixed:${d.id}`?'selected':''}>${d.name}</option>`).join('')}${state.courses.filter(c=>c.active&&c.hours>0).map(c=>`<option value="course:${c.id}" ${slot.activityId===`course:${c.id}`?'selected':''}>${c.name}</option>`).join('')}</select></div>
    <div class="plan-slot-actions"><button onclick="movePlanSlot(${i},-1)" ${i===0?'disabled':''}>↑ Πάνω</button><button onclick="movePlanSlot(${i},1)" ${i===todayPlan.length-1?'disabled':''}>↓ Κάτω</button></div>
    ${isOv?`<div class="overlap-warning">⚠ Επικάλυψη με άλλη δραστηριότητα</div>`:''}</div>`;});}
  body+=`</div><div class="actions" style="margin-top:14px"><button class="btn btn-primary" onclick="addPlanSlot()">+ Πρόσθεσε</button><button class="btn btn-ghost" onclick="autoFillPlan()">Αυτόματο</button></div><p class="note">Το αυτόματο γεμίζει με βάση τα υπόλοιπα μαθημάτων.</p>`;
  openModal({title:'Πλάνο σήμερα',body,buttons:[{text:'Κλείσιμο',class:'btn-primary'}]});
}
function addPlanSlot(){const plan=getTodayPlan();const last=plan[plan.length-1];const st=last?last.endTime:'08:00';const [h,m]=st.split(':').map(Number);const sm=h*60+m;const em=sm+60;plan.push({startTime:`${pad(Math.floor(sm/60))}:${pad(sm%60)}`,endTime:`${pad(Math.floor(em/60))}:${pad(em%60)}`,activityId:'',name:''});saveDailyPlan(plan);openPlanEditor();}
function removePlanSlot(i){const plan=getTodayPlan();plan.splice(i,1);saveDailyPlan(plan);openPlanEditor();}
function movePlanSlot(i,d){const plan=getTodayPlan();const n=i+d;if(n<0||n>=plan.length)return;const t=plan[i];plan[i]=plan[n];plan[n]=t;saveDailyPlan(plan);openPlanEditor();}
function updatePlanSlot(i,f,v){const plan=getTodayPlan();if(!plan[i])return;plan[i][f]=v;if(f==='activityId'){const [t,id]=v.split(':');if(t==='fixed'){const def=FIXED_DEFS.find(x=>x.id===id);if(def)plan[i].name=def.name;}else if(t==='course'){const c=state.courses.find(x=>x.id===id);if(c)plan[i].name=c.name;}}saveDailyPlan(plan);openPlanEditor();}
function autoFillPlan(){
const doFill=function(){const plan=[];const today=mondayIndex();let cur=8*60;const end=(24-state.settings.sleepHours)*60;state.courses.filter(c=>c.active&&c.hours>0&&!c.off.includes(today)).forEach(c=>{const info=courseInfo(c);if(info.todayTarget>60){const dur=Math.min(info.todayTarget,120);const em=cur+dur;if(em<=end){plan.push({startTime:`${pad(Math.floor(cur/60))}:${pad(cur%60)}`,endTime:`${pad(Math.floor(em/60))}:${pad(em%60)}`,activityId:`course:${c.id}`,name:c.name});cur=em+30;}}});saveDailyPlan(plan);openPlanEditor();showToast('Γέμισε αυτόματα.');};
if(getTodayPlan().length){confirmModal('Αυτόματο πλάνο','Θα αντικατασταθεί το υπάρχον πλάνο ημέρας.',doFill,'Ναι');}else{doFill();}
}

function renderActivities(){

function fixedCard(def,index){
  const info=fixedInfo(def.id);const isActive=state.active&&state.active.type==='fixed'&&state.active.id===def.id;const otherActive=state.active&&!isActive;
  const dayPct=info.dailyCap?clamp(info.dayMin/info.dailyCap*100,0,100):0;const weekLimit=def.id==='relax'?info.weeklyMax:info.weeklyCap;const weekPct=weekLimit?clamp(info.weekMin/weekLimit*100,0,100):0;
  let sc='info',st='Εντός';if(info.weekMin>weekLimit+0.5){sc='danger';st='Υπέρβαση εβδομάδας';}else if(info.dayMin>info.dailyCap+0.5){sc='danger';st='Υπέρβαση ημέρας';}else if(def.id==='relax'&&info.weekMin>info.weeklyCap+0.5){sc='warn';st='Υπέρβαση βάσης';}else if(info.target&&info.occ>info.target){sc='warn';st='Πάνω από στόχο';}else if(info.target&&info.occ>=info.target){sc='success';st='Στόχος';}else if(dayPct>=80||weekPct>=80){sc='warn';st='Οριακά';}

function renderAnalysis(){
  const stats=getStats4Weeks();const now=Date.now();const fourWeeks=28*86400000;const from=now-fourWeeks;
  const totalLogged=allTotalMin(from,now);const avgDaily=totalLogged/28;const awakeMin=1440-state.settings.sleepHours*60;
  let cd=0,td=0;for(let i=0;i<28;i++){const d=new Date(now);d.setDate(d.getDate()-i);d.setHours(0,0,0,0);const ds=d.getTime();const de=startOfNextDay(ds);let ok=true;FIXED_DEFS.forEach(def=>{if(totalMin('fixed',def.id,ds,de)>def.daily+0.5)ok=false;});td++;if(ok)cd++;}
  const cr=td>0?cd/td*100:0;const sorted=FIXED_DEFS.map(def=>({def,total:stats[def.id].total})).sort((a,b)=>b.total-a.total);
  const thisWeek=allTotalMin(startOfWeek(),startOfNextWeek());const lastWeek=allTotalMin(startOfWeek()-7*86400000,startOfWeek());
  const wt=lastWeek>0?((thisWeek-lastWeek)/lastWeek*100):0;

  html+=`<div class="card"><h3>Ανά δραστηριότητα</h3><div class="stack" style="margin-top:12px">${sorted.map(({def,total})=>{const s=stats[def.id];const tc=s.trend>10?'trend-up':s.trend<-10?'trend-down':'trend-flat';const tt=s.trend>0?`+${s.trend.toFixed(0)}%`:s.trend.toFixed(0)+'%';return `<div class="list-row"><div class="list-left"><strong style="color:${def.color}">${def.name}</strong><span class="muted" style="font-size:.72rem">Μέσος ${fmtHM(s.avg)} · ${s.days} μ. · ${s.overCount} υπ.</span></div><div style="text-align:right"><div class="list-value">${fmtHM(total)}</div><div class="${tc}" style="font-size:.68rem;font-weight:700">${tt}</div></div></div>`;}).join('')}</div></div>`;
  const cs=state.courses.filter(c=>c.active&&c.hours>0).map(c=>{const total=totalMin('course',c.id,from,now);const target=c.hours*60*4;return {c,total,target,pct:target>0?total/target*100:0};});
  if(cs.length){html+=`<div class="card"><h3>Μαθήματα 4 εβδομάδων</h3><div class="stack" style="margin-top:12px">${cs.map(({c,total,target,pct})=>`<div class="list-row"><div class="list-left"><strong>${esc(c.name)}</strong><div class="progress" style="--accent:${c.color};--accent2:${c.color2}"><span style="width:${clamp(pct,0,100)}%"></span></div></div><div class="list-value">${fmtHM(total)} / ${fmtHM(target)}</div></div>`).join('')}</div></div>`;}
  const lr=state.weeklyReviews[state.weeklyReviews.length-1];
  if(lr){html+=`<div class="card"><h3>Τελευταίο Weekly Review</h3><p class="muted" style="margin-bottom:12px">${shortDate(lr.date)}</p>

    <div class="review-section"><h4>Compliance</h4><div class="review-stat"><span>Εντός</span><span>${lr.stats.compliance.days}/${lr.stats.compliance.total}</span></div><div class="review-stat"><span>Ρυθμός</span><span>${lr.stats.compliance.rate.toFixed(0)}%</span></div></div>
    <div class="review-section"><h4>Χαλάρωση</h4><div class="review-stat"><span>Σύνολο</span><span>${fmtHM(lr.stats.relax.total)}</span></div><div class="review-stat"><span>Υπερβάσεις</span><span>${lr.stats.relax.overs}</span></div></div>
    <div class="review-section"><h4>Γυμναστήριο</h4><div class="review-stat"><span>Σύνολο</span><span>${fmtHM(lr.stats.gym.total)}</span></div><div class="review-stat"><span>Φορές</span><span>${lr.stats.gym.occurrences}/4</span></div></div>

function renderRunningDock(){const dock=$('#runningDock');if(!state.active){dock.innerHTML='';return;}const a=state.active;const name=a.type==='fixed'?(fixedInfo(a.id)||{def:{name:'Δραστηριότητα'}}).def.name:(state.courses.find(c=>c.id===a.id)||{name:'Μάθημα'}).name;dock.innerHTML=`<div class="dock-card"><div class="dock-info"><span>${esc(name)}</span><strong id="dockTime">${fmtClock(activeElapsedMs())}</strong><small id="dockSub">${activeSubText()}</small><div class="dock-progress"><span id="dockProgress" style="width:${activeProgressPct()}%"></span></div></div><button class="btn btn-stop dock-stop" onclick="stopActive()">Διακοπή</button></div>`;}

function activeProgressPct(){if(!state.active)return 0;if(state.active.type==='fixed'){const info=fixedInfo(state.active.id);return info?clamp(info.dayMin/info.dailyCap*100,0,100):0;}const c=state.courses.find(x=>x.id===state.active.id);if(!c)return 0;const info=courseInfo(c);return info.targetMin?clamp(info.weekMin/info.targetMin*100,0,100):0;}

function updateLive(){
  if(state.active){const t=$('#dockTime');if(t)t.textContent=fmtClock(activeElapsedMs());const s=$('#dockSub');if(s)s.textContent=activeSubText();const p=$('#dockProgress');if(p)p.style.width=activeProgressPct()+'%';}
  if($('#homeLogged')){const sleepMin=state.settings.sleepHours*60;const awake=1440-sleepMin;const logged=allTotalMin(startOfDay(),startOfNextDay());const remain=awake-logged;const pct=clamp(logged/awake*100,0,100);const circ=2*Math.PI*58;$('#homeLogged').textContent=fmtHM(logged);const rem=$('#homeRemain');if(rem){rem.textContent=fmtHM(remain);rem.className=remain<0?'text-danger':'text-success';}const ring=$('#homeRingFg');if(ring)ring.style.strokeDashoffset=circ*(1-pct/100);}
  state.reminders.forEach(r=>{const elapsed=(Date.now()-r.lastDone)/60000;const due=r.intervalMin-elapsed;const pct=clamp(elapsed/r.intervalMin*100,0,100);const dueEl=document.querySelector(`[data-reminder-due="${r.id}"]`);if(dueEl)dueEl.textContent=countdownText(due);const sinceEl=document.querySelector(`[data-reminder-since="${r.id}"]`);if(sinceEl)sinceEl.textContent=timeSinceMinutes(elapsed);const pctEl=document.querySelector(`[data-reminder-pct="${r.id}"]`);if(pctEl)pctEl.textContent=Math.round(pct)+'%';const progEl=document.querySelector(`[data-reminder-progress="${r.id}"]`);if(progEl)progEl.style.width=pct+'%';const card=document.querySelector(`[data-reminder-card="${r.id}"]`);if(card)card.classList.toggle('overdue',due<=0);});
  updateFocusBadge();
  if(!$('#focusOverlay').classList.contains('hidden')){const p=P();$('#foTimer').textContent=p.phase==='proposal'?'—':fmtClock(pomoPhaseRemaining());}
}

function tick(){
const p=P();const now=Date.now();
if(p.phase==='focus'&&now>=p.phaseEndsAt)completeFocus();
else if((p.phase==='break'||p.phase==='longbreak')&&now>=p.phaseEndsAt)completeBreak();
if(state.active)handleActive();
updateLive();
if(now-lastReminderCheck>30000){lastReminderCheck=now;checkRemindersDue();}
const nowMin=Math.floor(now/60000);
if(!tick._revMin||tick._revMin!==nowMin){tick._revMin=nowMin;const review=generateWeeklyReview();if(review){pushAlert({title:'📊 Weekly Review',message:`Μελέτη ${review.stats.study.pct.toFixed(0)}% · Compliance ${review.stats.compliance.rate.toFixed(0)}%. ${review.stats.suggestions.length?review.stats.suggestions[0]:''}`,buttons:[{text:'Αναλυτικά',class:'btn-primary',onClick:()=>setTab('analysis')},{text:'Αργότερα',class:'btn-ghost'}]});}}
}

function buildFixedAlerts(def,info){const alerts=[];const d=info.dailyCap;if(def.id==='walk'){alerts.push({key:'day30',scope:'day',min:30,cap:d,title:'30λ'});alerts.push({key:'day60',scope:'day',min:60,cap:d,title:'60λ'});alerts.push({key:'day110',scope:'day',min:Math.max(0,d-10),cap:d,title:'10λ πριν'});alerts.push({key:'daycap',scope:'day',min:d,cap:d,title:'Όριο'});}else if(def.id==='reading'){alerts.push({key:'day20',scope:'day',min:20,cap:d,title:'20λ'});alerts.push({key:'day25',scope:'day',min:25,cap:d,title:'25λ'});alerts.push({key:'daycap',scope:'day',min:d,cap:d,title:'30λ'});}else if(def.id==='relax'){alerts.push({key:'half',scope:'day',min:d/2,cap:d,title:'Μισό'});alerts.push({key:'p80',scope:'day',min:d*0.8,cap:d,title:'80%'});alerts.push({key:'cap',scope:'day',min:d,cap:d,title:'Όριο'});alerts.push({key:'double',scope:'day',min:info.hardLimit,cap:info.hardLimit,title:'Μέγιστο'});}else{alerts.push({key:'p80',scope:'day',min:d*0.8,cap:d,title:'80%'});alerts.push({key:'cap',scope:'day',min:d,cap:d,title:'Όριο'});}const wl=def.id==='relax'?info.weeklyMax:info.weeklyCap;if(wl){alerts.push({key:'week80',scope:'week',min:wl*0.8,cap:wl,title:'80% εβδ.'});alerts.push({key:'weekcap',scope:'week',min:wl,cap:wl,title:'Εβδομαδιαίο'});}const seen=new Set();return alerts.filter(a=>{const k=a.key+'|'+a.scope+'|'+Math.round(a.min*10);if(seen.has(k)||a.min<=0)return false;seen.add(k);return true;});}
function handleFixedActive(a){const info=fixedInfo(a.id);if(!info)return;if(info.def.hard&&info.dayMin>=info.hardLimit-0.05){pushAlert({title:`${info.def.name}: όριο`,message:`Έφτασες ${fmtPrecise(info.dayMin)} από ${fmtPrecise(info.hardLimit)}.`});stopActive(true);return;}buildFixedAlerts(info.def,info).forEach(al=>{const total=al.scope==='week'?info.weekMin:info.dayMin;if(total>=al.min-0.05&&!a.shownAlerts.includes(al.key)){a.shownAlerts.push(al.key);saveState();const cap=al.cap;const st=al.scope==='day'?'ημερήσιο':'εβδομαδιαίο';let msg;if(total>=cap-0.05){msg=`Έφτασες το ${st} όριο.${total>cap?` Υπέρβαση ${fmtHM(total-cap)}.`:''}`;}else{msg=`Χρησιμοποίησες ${fmtHM(total)}. Απομένουν ${fmtHM(cap-total)}.`;}pushAlert({title:`${info.def.name}: ${al.title}`,message:msg});}});}
function handleCourseActive(a){const c=state.courses.find(x=>x.id===a.id);if(!c)return;const info=courseInfo(c);if(info.todayTarget>0&&info.dayMin>=info.todayTarget-0.05&&!a.shownAlerts.includes('today')){a.shownAlerts.push('today');saveState();pushAlert({title:`${c.name}: ημερήσιος`,message:`Κάλυψες ${fmtHM(info.todayTarget)}.`});}if(info.targetMin>0&&info.weekMin>=info.targetMin-0.05&&!a.shownAlerts.includes('week')){a.shownAlerts.push('week');saveState();pushAlert({title:`${c.name}: εβδομαδιαίος`,message:`Έφτασες ${fmtHM(info.targetMin)}.`});}}

openModal({title:item?'Επεξεργασία μηνιαίας':'Νέα μηνιαία επιλογή',body,buttons:[{text:'Ακύρωση',class:'btn-ghost'},{text:'Αποθήκευση',class:'btn-primary',close:false,onClick:()=>{const sheet=document.querySelector('#modalOverlay .sheet');const err=sheet.querySelector('#formError');const name=sheet.querySelector('#mName').value.trim();const hours=clamp(parseFloat(sheet.querySelector('#mHours').value)||0,0.5,72);if(!name){err.textContent='Δώσε όνομα.';err.classList.add('show');return false;}if(item){item.name=name;item.hours=hours;}else{MONTHLY_DEFS.push({id:'mon_'+Date.now(),name,hours});}saveState();closeModal();render();showToast('Αποθηκεύτηκε.');}}]});}
function deleteMonthly(id){const item=MONTHLY_DEFS.find(x=>x.id===id);if(!item)return;confirmModal('Διαγραφή',`Διαγραφή "${item.name}";`,()=>{MONTHLY_DEFS.splice(MONTHLY_DEFS.indexOf(item),1);delete state.monthly.items[id];saveState();closeModal();render();showToast('Διαγράφηκε.');},'Διαγραφή');}
function deleteCourse(id){const c=state.courses.find(x=>x.id===id);if(!c||c.type!=='makeup')return;confirmModal('Καθαρισμός',`"${c.name}";`,()=>{c.name=c.id==='makeup1'?'Εμβόλιμη 1':'Εμβόλιμη 2';c.hours=0;c.off=[];c.active=false;state.logs=state.logs.filter(l=>!(l.type==='course'&&l.id===id));if(state.active&&state.active.type==='course'&&state.active.id===id)state.active=null;saveState();closeModal();render();showToast('Καθαρίστηκε.');},'Καθαρισμός');}
function resetSemester(){confirmModal('Νέο εξάμηνο','Μηδενισμός καταγραφών μαθημάτων.',()=>{if(state.active&&state.active.type==='course')endSession(true);state.logs=state.logs.filter(l=>l.type!=='course');state.semesterStart=Date.now();saveState();render();showToast('Μηδενίστηκε.');},'Μηδενισμός');}
function clearWeekLogs(){confirmModal('Μηδενισμός εβδομάδας','Διαγραφή καταγραφών.',()=>{if(state.active)endSession(true);const ws=startOfWeek(),wn=startOfNextWeek();state.logs=state.logs.filter(l=>l.end<=ws||l.start>=wn);saveState();render();showToast('Μηδενίστηκε.');},'Μηδενισμός');}
function clearAllData(){confirmModal('Επαναφορά','Διαγραφή όλων.',()=>{state=defaultState();saveState();applyUi();render();showToast('Επανήλθε.');},'Επαναφορά');}
function checkRemindersDue(){let ch=false;state.reminders.forEach(r=>{const dueTs=r.lastDone+r.intervalMin*60000;if(Date.now()>=dueTs&&(!r.notifiedAt||r.notifiedAt<r.lastDone)){r.notifiedAt=Date.now();ch=true;pushAlert({title:'Υπενθύμιση',message:`${r.name}: ώρα να την κάνεις.`,buttons:[{text:'Έγινε',class:'btn-success',onClick:()=>markReminderDone(r.id)},{text:'Αργότερα',class:'btn-ghost'}]});}});if(ch)saveState();}
function openModal(cfg){if(modalOpen){alertQueue.push(cfg);return;}modalOpen=true;const overlay=$('#modalOverlay');const sheet=document.createElement('div');sheet.className='sheet';sheet.innerHTML=`<div class="modal-handle"></div>${cfg.title?`<h3>${cfg.title}</h3>`:''}${cfg.message?`<p class="modal-message">${cfg.message}</p>`:''}${cfg.body||''}<div class="modal-actions"></div>`;overlay.innerHTML='';overlay.appendChild(sheet);overlay.classList.add('open');const actions=sheet.querySelector('.modal-actions');const buttons=cfg.buttons&&cfg.buttons.length?cfg.buttons:[{text:'Κλείσιμο'}];buttons.forEach(b=>{const btn=document.createElement('button');btn.className='btn '+(b.class||'btn-primary');btn.textContent=b.text;btn.onclick=()=>{if(b.onClick){const res=b.onClick();if(res===false)return;}if(b.close!==false)closeModal();};actions.appendChild(btn);});if(cfg.onMount)cfg.onMount(sheet);}
function closeModal(){modalOpen=false;const overlay=$('#modalOverlay');overlay.classList.remove('open');overlay.innerHTML='';setTimeout(processAlertQueue,220);}
function pushAlert(cfg){alertQueue.push(cfg);processAlertQueue();}
function processAlertQueue(){if(modalOpen||!alertQueue.length)return;const cfg=alertQueue.shift();openModal(cfg);notify(cfg.title,cfg.message);}
function confirmModal(title,message,onConfirm,confirmText,cancelText){openModal({title,message,buttons:[{text:cancelText||'Άκυρο',class:'btn-ghost'},{text:confirmText||'Ναι',class:'btn-primary',onClick:onConfirm}]});}
function notify(title,body){if(state.settings.notifications&&'Notification' in window&&Notification.permission==='granted'){try{new Notification(title||'Ρυθμός',{body:body||''});}catch(e){}}if(state.settings.sound)beep();}
function beep(){if(!state.settings.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.setValueAtTime(620,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(880,audioCtx.currentTime+.14);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.32);o.start();o.stop(audioCtx.currentTime+.34);}catch(e){}}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300);}

function showOnboarding(){if(state.onboardingComplete)return;const steps=[{icon:'⏱',title:'Καλώς ήρθες στον Ρυθμό',text:'Χρονοδιαχείριση για φοιτητές: όρια, στόχοι, pomodoro και στατιστικά, όλα σε ένα μέρος.'},{icon:'🧭',title:'Πέντε καρτέλες',text:'Ημέρα: overview, πλάνο, προτάσεις. Δραστηριότητες: χρονόμετρα και μαθήματα. Πρόγραμμα: timeline και φορτίο. Ανάλυση: στατιστικά. Ρυθμίσεις.'},{icon:'🍅',title:'Pomodoro με καταγραφή',text:'Ξεκίνα κύκλο, διάλεξε μάθημα, και ο χρόνος καταγράφεται αυτόματα εκεί. Ρύθμισε focus και διάλειμμα όπως θες.'}];let cur=0;const ov=document.createElement('div');ov.className='onboarding-overlay';function rs(){const s=steps[cur];ov.innerHTML=`<div class="onboarding-step"><div class="onboarding-icon">${s.icon}</div><h2>${s.title}</h2><p>${s.text}</p><div class="onboarding-dots">${steps.map((_,i)=>`<div class="onboarding-dot ${i===cur?'active':''}"></div>`).join('')}</div><div class="onboarding-actions">${cur>0?`<button class="btn btn-ghost" onclick="prevOb()">Πίσω</button>`:`<button class="btn btn-ghost" onclick="skipOb()">Παράλειψη</button>`}<button class="btn btn-primary" onclick="${cur===steps.length-1?'doneOb()':'nextOb()'}">${cur===steps.length-1?'Ξεκίνα':'Συνέχεια'}</button></div>`;}window.nextOb=()=>{cur++;rs();};window.prevOb=()=>{cur--;rs();};window.skipOb=()=>doneOb();window.doneOb=()=>{state.onboardingComplete=true;saveState();ov.remove();showToast('Καλώς ήρθες!');};document.body.appendChild(ov);rs();}
function resetOnboarding(){state.onboardingComplete=false;saveState();showOnboarding();}

var APP_VERSION='1.4.14';
var netGranted=false;
function checkForUpdate(){
  if(netGranted)return;
  confirmModal('Πρόσβαση στο internet','Επιτρέπεις προσωρινή πρόσβαση στο internet αποκλειστικά για τον έλεγχο ενημερώσεων; Η άδεια ανακαλείται αυτόματα μόλις ολοκληρωθεί ο έλεγχος ή η ενημέρωση.',function(){
    netGranted=true;
    runUpdateCheck();
  },'Επιτρέπω','Όχι');
}
function runUpdateCheck(){
  var btn=document.getElementById('updateBtn');
  if(btn)btn.classList.add('busy');
  fetch('index.html?vcheck='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('http');
    return r.text();
  }).then(function(txt){
    var m=txt.match(/name="app-version"\s+content="([^"]+)"/);
    var remote=m?m[1]:null;
    netGranted=false;
    if(btn)btn.classList.remove('busy');
    if(!remote){showToast('Δεν βρέθηκε πληροφορία έκδοσης στον server.');return;}
    if(remote===APP_VERSION){showToast('Έχεις την πιο πρόσφατη έκδοση ('+APP_VERSION+').');return;}
    confirmModal('Διαθέσιμη ενημέρωση','Υπάρχει νέα έκδοση '+remote+'. Εσύ τρέχεις την '+APP_VERSION+'. Να ενημερωθεί η εφαρμογή τώρα;',function(){
      netGranted=true;
      showToast('Ενημέρωση σε εξέλιξη…');
      setTimeout(function(){location.reload();},400);
    },'Ενημέρωση','Αργότερα');
  }).catch(function(){
    netGranted=false;
    if(btn)btn.classList.remove('busy');
    showToast('Ο έλεγχος απέτυχε. Δεν υπάρχει σύνδεση ή ο server δεν απάντησε.');
  });
}

<script>
if(!state.audio)state.audio={categories:[],volume:.7,loop:true,curCat:null,curTrack:null,playing:false};
var AUD_EL=new Audio();AUD_EL.loop=true;
var AUD_DBP=null;
function audDB(){if(AUD_DBP)return AUD_DBP;AUD_DBP=new Promise(function(res,rej){var r=indexedDB.open('rhythmos-audio',1);r.onupgradeneeded=function(){r.result.createObjectStore('blobs');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return AUD_DBP;}
function audPut(k,b){return audDB().then(function(db){return new Promise(function(res,rej){var t=db.transaction('blobs','readwrite');t.objectStore('blobs').put(b,k);t.oncomplete=res;t.onerror=rej;});});}
function audGet(k){return audDB().then(function(db){return new Promise(function(res,rej){var t=db.transaction('blobs','readonly');var q=t.objectStore('blobs').get(k);q.onsuccess=function(){res(q.result);};q.onerror=rej;});});}
function audDel(k){return audDB().then(function(db){return new Promise(function(res,rej){var t=db.transaction('blobs','readwrite');t.objectStore('blobs').delete(k);t.oncomplete=res;t.onerror=rej;});});}
function audSetVol(v){state.audio.volume=v;AUD_EL.volume=v;saveState();}
function audFindTrack(){var a=state.audio;if(!a.curCat||!a.curTrack)return null;var c=a.categories.find(function(x){return x.id===a.curCat;});if(!c)return null;return c.tracks.find(function(x){return x.id===a.curTrack;})||null;}
function audToggle(){var a=state.audio;if(!a.playing){var t=audFindTrack();if(t)audPlayTrack(a.curCat,t);else if(a.categories.length&&a.categories[0].tracks.length)audPlayTrack(a.categories[0].id,a.categories[0].tracks[0]);else openAudioSheet();}else{a.playing=false;noiseStop();AUD_EL.pause();saveState();}}
function audNext(){var a=state.audio;var c=a.categories.find(function(x){return x.id===a.curCat;});if(!c||!c.tracks.length)return;var i=c.tracks.findIndex(function(x){return x.id===a.curTrack;});audPlayTrack(c.id,c.tracks[(i+1)%c.tracks.length]);}
var AUD_WAV={};
function encodeWav(samples,sr){var n=samples.length;var buf=new ArrayBuffer(44+n*2);var v=new DataView(buf);function ws(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));}ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);for(var i=0;i<n;i++){var s=Math.max(-1,Math.min(1,samples[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true);}return new Blob([buf],{type:'audio/wav'});}
function makeNoiseWav(kind){var sr=22050,sec=6,n=sr*sec;var x=new Float32Array(n);var l=0;for(var i=0;i<n;i++){var w=Math.random()*2-1;if(kind==='sea'){l=(l+0.02*w)/1.02;x[i]=l*3.5;}else{x[i]=w*0.35;}}
if(kind==='sea'){for(var i=0;i<n;i++){x[i]*=0.55+0.45*Math.sin(2*Math.PI*0.12*(i/sr));}}else{var y=0;for(var i=0;i<n;i++){y=0.7*y+0.3*x[i];x[i]=y;}}
var f=Math.floor(sr*0.05);for(var i=0;i<f;i++){var g=i/f;x[i]*=g;x[n-1-i]*=g;}
return encodeWav(x,sr);}
function noiseStart(){return;}
function noiseStop(){try{AUD_EL.pause();}catch(e){}}
var AUD_REAL={
'AMBForst_Forest%20(ID%200100)_BigSoundBank.com.wav':'forest.mp3',
'audio/AMBForst_Forest%20(ID%200100)_BigSoundBank.com.wav':'forest.mp3',
'Erik_Satie_-_gymnopedies_-_la_1_ere._lent_et_douloureux.ogg':'satie.mp3',
'audio/Erik_Satie_-_gymnopedies_-_la_1_ere._lent_et_douloureux.ogg':'satie.mp3',
'002_Synthwave_15k.mp3':'ambient.mp3',
'audio/002_Synthwave_15k.mp3':'ambient.mp3',
'rain.mp3':'forest.mp3',
'gymnopedie.mp3':'satie.mp3',
'audio/forest.mp3':'forest.mp3',
'audio/satie.mp3':'satie.mp3',
'audio/ambient.mp3':'ambient.mp3',
'forest.mp3':'forest.mp3',
'satie.mp3':'satie.mp3',
'ambient.mp3':'ambient.mp3'
};
var AUD_NAMES={'forest.mp3':'Δάσος (ηχογράφηση)','satie.mp3':'Gymnopédie No. 1 — Satie','ambient.mp3':'Calm Ambient'};
var AUD_BUILTIN=[{cat:'nature',name:'Φύση',tracks:[{id:'forest-file',kind:'file',url:'forest.mp3',name:'Δάσος (ηχογράφηση)'},{id:'rain',kind:'noise',name:'Βροχή'},{id:'sea',kind:'noise',name:'Θάλασσα'}]},{cat:'classical',name:'Κλασική',tracks:[{id:'gymnopedie',kind:'file',url:'satie.mp3',name:'Gymnopédie No. 1 — Satie'}]},{cat:'ambient',name:'Ambient',tracks:[{id:'ambient1',kind:'file',url:'ambient.mp3',name:'Calm Ambient'}]}];
function ensureBuiltin(){var a=state.audio;AUD_BUILTIN.forEach(function(b){var c=a.categories.find(function(x){return x.id===b.cat;});if(!c){c={id:b.cat,name:b.name,builtin:true,tracks:[]};a.categories.push(c);}c.name=b.name;c.builtin=true;b.tracks.forEach(function(t){if(!c.tracks.find(function(x){return x.id===t.id;}))c.tracks.push({id:t.id,kind:t.kind,url:t.url,name:t.name});});});}
function audNormalize(){var a=state.audio;a.categories.forEach(function(c){c.tracks.forEach(function(t){if(t.kind==='file'){if(AUD_REAL[t.url])t.url=AUD_REAL[t.url];if(AUD_NAMES[t.url])t.name=AUD_NAMES[t.url];}});});
var seen={};a.categories.slice().forEach(function(c){if(seen[c.name]){var keep=seen[c.name];c.tracks.forEach(function(t){if(!keep.tracks.find(function(x){return x.id===t.id;}))keep.tracks.push(t);});a.categories=a.categories.filter(function(x){return x!==c;});if(a.curCat===c.id)a.curCat=keep.id;}else{seen[c.name]=c;}});
a.categories.forEach(function(c){var u={};c.tracks=c.tracks.filter(function(t){var k=(t.kind==='file')?t.url:t.id;if(u[k])return false;u[k]=1;return true;});});}
function audPlayTrack(catId,tr){var a=state.audio;if(a.volume<=0)a.volume=0.7;a.curCat=catId;a.curTrack=tr.id;a.playing=true;try{AUD_EL.pause();}catch(e){}
var finish=function(url){try{AUD_EL.src=url;AUD_EL.volume=a.volume;AUD_EL.loop=a.loop;AUD_EL.play().then(function(){showToast('Παίζει: '+tr.name);audInject();}).catch(function(e){showToast('Αποτυχία αναπαραγωγής ('+(e&&e.name?e.name:'σφάλμα')+'). Έλεγξε το media volume.');a.playing=false;audInject();});}catch(e){showToast('Σφάλμα ήχου.');a.playing=false;audInject();}};
if(tr.kind==='noise'){if(!AUD_WAV[tr.id]){AUD_WAV[tr.id]=URL.createObjectURL(makeNoiseWav(tr.id));}finish(AUD_WAV[tr.id]);}
else if(tr.kind==='local'){audGet(tr.key).then(function(b){if(!b){showToast('Το αρχείο δεν βρέθηκε στη συσκευή.');a.playing=false;audInject();return;}var u=URL.createObjectURL(b);AUD_EL.addEventListener('loadeddata',function(){URL.revokeObjectURL(u);},{once:true});finish(u);});}
else{finish(tr.url);}
saveState();audInject();}
var AUD_FILE=null;
function audPick(catId){if(!AUD_FILE){AUD_FILE=document.createElement('input');AUD_FILE.type='file';AUD_FILE.accept='audio/*';AUD_FILE.multiple=true;AUD_FILE.style.display='none';document.body.appendChild(AUD_FILE);AUD_FILE.onchange=function(){audImport(AUD_FILE.dataset.cat,AUD_FILE.files);AUD_FILE.value='';};}AUD_FILE.dataset.cat=catId;AUD_FILE.click();}
function audImport(catId,files){var c=state.audio.categories.find(function(x){return x.id===catId;});if(!c||!files.length)return;var done=0;Array.prototype.forEach.call(files,function(f){var key='b'+Date.now()+'_'+Math.random().toString(36).slice(2,8);audPut(key,f).then(function(){c.tracks.push({id:key,name:f.name.replace(/\.[^.]+$/,''),kind:'local',key:key});done++;saveState();if(done===files.length){showToast('Προστέθηκαν '+done+' αρχεία.');audReopen(function(){openCategorySheet(catId);});}});});}
function audDelTrack(catId,trId){var c=state.audio.categories.find(function(x){return x.id===catId;});if(!c)return;var t=c.tracks.find(function(x){return x.id===trId;});if(!t)return;if(state.audio.curTrack===trId){state.audio.playing=false;noiseStop();AUD_EL.pause();}if(t.kind==='local')audDel(t.key);c.tracks=c.tracks.filter(function(x){return x.id!==trId;});saveState();audReopen(function(){openCategorySheet(catId);});}
function audNewCat(){var n=prompt('Όνομα νέας κατηγορίας:');if(!n)return;state.audio.categories.push({id:'c'+Date.now(),name:n,tracks:[]});saveState();audReopen(openAudioSheet);}
function audRenameCat(catId){var c=state.audio.categories.find(function(x){return x.id===catId;});if(!c)return;var n=prompt('Νέο όνομα κατηγορίας:',c.name);if(!n)return;c.name=n;saveState();audReopen(openAudioSheet);}
function audDelCat(catId){var c=state.audio.categories.find(function(x){return x.id===catId;});if(!c)return;if(!confirm('Διαγραφή κατηγορίας "'+c.name+'" και των ήχων της;'))return;c.tracks.forEach(function(t){if(t.kind==='local')audDel(t.key);});if(state.audio.curCat===catId){state.audio.playing=false;noiseStop();AUD_EL.pause();}state.audio.categories=state.audio.categories.filter(function(x){return x.id!==catId;});saveState();audReopen(openAudioSheet);}

var STOP_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
